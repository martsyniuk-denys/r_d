[databases]
; What the application, the migrations and psql use. Transaction pooling: a server
; connection is held only for the length of a transaction, so a handful of Postgres
; backends can serve hundreds of API clients.
marketplace = host=postgres port=5432 dbname=marketplace

; Same database, session pooling, separate alias. Tools that need a session to
; survive between statements — pg_dump above all — are routed here instead of being
; the reason to lower pool_mode for everyone. scripts/backup.sh uses this alias.
marketplace_session = host=postgres port=5432 dbname=marketplace pool_mode=session

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Admin console: psql -h 127.0.0.1 -p 56432 -U marketplace -d pgbouncer -c "SHOW POOLS"
admin_users = marketplace
stats_users = marketplace

pool_mode = transaction

; Small on purpose: the whole point is that the API may grow to many instances
; while Postgres keeps serving them from a handful of backends.
default_pool_size = 8
min_pool_size = 2
reserve_pool_size = 4
reserve_pool_timeout = 3
max_db_connections = 40

; Room to spare on the client side — this is the number PgBouncer exists to absorb.
max_client_conn = 200

; Server connections are recycled between transactions, so everything a previous
; transaction left behind has to go with them.
server_reset_query = DISCARD ALL

; PgBouncer >= 1.21 tracks prepared statements itself, which is what lets the
; TypeORM/pg driver keep using them in transaction mode.
max_prepared_statements = 200

ignore_startup_parameters = extra_float_digits,options,search_path

log_connections = 1
log_disconnections = 0
