openapi: 3.0.3

info:
  title: Marketplace API
  version: 1.0.0
  description: |
    Marketplace API contract (course project, homework 09).

    Three cross-cutting rules this document pins down in a machine-checkable way:
      * lists are served only with cursor pagination (`limit` + an opaque `cursor`);
      * creating a resource requires an `Idempotency-Key` header;
      * every 4xx/5xx error is `application/problem+json` (RFC 9457).

    Money is always integer minor units (`*_cents`), never a float and never a decimal string.

    Authentication (homework 24): `POST /auth/login` returns a short-lived ES256 access
    token and an opaque refresh token. Operations that declare `bearerAuth` answer
    401 without a valid access token and 403 when the token is valid but the caller
    may not do this (wrong role, or somebody else's order).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Marketplace API team
    url: https://example.com/marketplace

servers:
  - url: http://localhost:3000
    description: Local development server

# Public by default (the catalogue, health, login and refresh); every protected
# operation names `bearerAuth` itself. The explicit empty array satisfies the
# redocly `security-defined` rule.
security: []

tags:
  - name: auth
    description: Login, refresh-token rotation and logout.
  - name: products
    description: Marketplace product catalogue.
  - name: orders
    description: Customer orders.
  - name: ops
    description: Operational endpoints used by probes and deployment tooling.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: |
        Reports that the process is alive and how long it has been running.
        `uptime_seconds` is what proves a database password rotation did not
        restart the service: it keeps growing across a rotation.
      tags: [ops]
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      description: |
        Starts a new token family: one access token (JWT, ES256, short-lived) and one
        opaque refresh token. Unknown email and wrong password are the same 401.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Exchange a refresh token for a new pair
      description: |
        Rotation: every successful call returns a new pair and retires the refresh
        token it was given. Presenting a retired refresh token again is treated as
        theft — the whole family is revoked, including the newest token, and the
        call is 401. Clients must serialise refreshes (one in flight at a time).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new token pair; the refresh token sent is now used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      operationId: logout
      summary: End the session
      description: |
        Two effects in one transaction: the refresh-token family of this session is
        revoked, and this access token's `jti` is denylisted until its `exp`.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Both tokens of the session are dead.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      operationId: getMe
      summary: Who the access token says the caller is
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The verified claims of the access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /products:
    get:
      operationId: listProducts
      summary: List products (cursor pagination)
      description: |
        Returns a page of products. The next page is requested from the same URL
        with the `cursor` value returned as `next_cursor` by the previous response.
      tags: [products]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: |
            Opaque position token. Clients MUST NOT parse, decode or construct it
            themselves — its format is an implementation detail and may change
            without an API version bump. The only correct use is to pass back,
            unchanged, the `next_cursor` value from the previous response.
          schema:
            type: string
            minLength: 1
          example: b2Zmc2V0OjIw
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      operationId: createProduct
      summary: Create a product
      description: |
        Creates a new product in the catalogue, sold by the caller. Only the `seller`
        and `admin` roles may; a buyer's valid token is 403. The operation is
        idempotent on the `Idempotency-Key` header.
      tags: [products]
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Client-generated replay key (UUID v4 recommended).
            Semantics: the same key with the same request body returns the same
            response (the same 201 and the same resource), no new resource is
            created, and the response carries `Idempotency-Replay: true`.
            The same key with a DIFFERENT request body returns 422
            application/problem+json, because the key is already bound to
            another request. Keys are retained for 24 hours.
          schema:
            type: string
            minLength: 8
            maxLength: 255
          example: 6f1f8f4e-4d4b-4a53-9a0e-2c1f0b7a1c11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created (or a previously created one replayed for the same idempotency key).
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReuse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        description: Product identifier.
        schema:
          type: string
          minLength: 1
        example: p_1
    get:
      operationId: getProduct
      summary: Get a product by identifier
      description: Returns a single catalogue product.
      tags: [products]
      responses:
        '200':
          description: Product found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders:
    get:
      operationId: listOrders
      summary: List orders (cursor pagination)
      description: |
        Returns a page of the caller's own orders (every order, for an admin). The
        next page is requested from the same URL with the `cursor` value returned as
        `next_cursor` by the previous response.
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: |
            Opaque position token. Clients MUST NOT parse, decode or construct it
            themselves — its format is an implementation detail and may change
            without an API version bump. The only correct use is to pass back,
            unchanged, the `next_cursor` value from the previous response.
          schema:
            type: string
            minLength: 1
          example: b2Zmc2V0OjIw
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      operationId: createOrder
      summary: Create an order
      description: |
        Creates an order from catalogue items. Line prices and `total_cents` are
        computed by the server — the client sends only `product_id` and `qty`.
        The buyer is the subject of the access token. The operation is idempotent
        on the `Idempotency-Key` header, per buyer.
      tags: [orders]
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Client-generated replay key (UUID v4 recommended).
            Semantics: the same key with the same request body returns the same
            response (the same 201 and the same resource), no new resource is
            created, and the response carries `Idempotency-Replay: true`.
            The same key with a DIFFERENT request body returns 422
            application/problem+json, because the key is already bound to
            another request. Keys are retained for 24 hours.
          schema:
            type: string
            minLength: 8
            maxLength: 255
          example: 6f1f8f4e-4d4b-4a53-9a0e-2c1f0b7a1c11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created (or a previously created one replayed for the same idempotency key).
          headers:
            Idempotency-Replay:
              $ref: '#/components/headers/IdempotencyReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReuse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        description: Order identifier.
        schema:
          type: string
          minLength: 1
        example: o_1
    get:
      operationId: getOrder
      summary: Get an order by identifier
      description: |
        Returns a single order together with its line items. Only its buyer (or an
        admin) may read it; anybody else's valid token is 403.
      tags: [orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Order found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/status:
    parameters:
      - name: orderId
        in: path
        required: true
        description: Order identifier.
        schema:
          type: string
          minLength: 1
        example: o_1
    patch:
      operationId: updateOrderStatus
      summary: Change the status of an order
      description: |
        Writes the new status and publishes an `order.status` event for this order
        on the realtime bus. Every connected client in the `orders:<id>` room gets
        it over WebSocket, and every open `GET /orders/{orderId}/events` stream
        gets it as an SSE frame — one write, two transports.

        Transitions are not restricted: any status in the enum may be written, and
        each accepted write is one event with the next sequence number. Only the
        buyer of the order (or an admin) may write it.
      tags: [orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: The order after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/events:
    parameters:
      - name: orderId
        in: path
        required: true
        description: Order identifier.
        schema:
          type: string
          minLength: 1
        example: o_1
      - name: Last-Event-ID
        in: header
        required: false
        description: |
          Sequence number of the last event the client already has. The server
          replays every buffered event with a higher number before switching the
          stream to live, which is how a reconnect loses nothing. Sent
          automatically by `EventSource` on reconnect.
        schema:
          type: integer
          minimum: 0
        example: 3
    get:
      operationId: streamOrderEvents
      summary: Server-sent stream of status changes for one order
      description: |
        Long-lived `text/event-stream` response. Each status change arrives as one
        SSE frame with `id:` (the per-order sequence number), `event: order.status`
        and a JSON `data:` payload. The first line of the stream is `retry: 1000`,
        which sets the client's reconnect delay. Needs the access token in the
        `Authorization` header, so it is read with a fetch-based SSE client — the
        browser `EventSource` cannot send one, and a token in the URL ends up in logs.
      tags: [orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The event stream. Stays open until the client disconnects.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames, separated by a blank line.
                example: |
                  retry: 1000

                  id: 4
                  event: order.status
                  data: {"id":4,"order_id":"o_1","status":"paid","previous_status":"created","changed_at":"2026-09-30T20:15:04.000Z"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `POST /auth/login` or `POST /auth/refresh`: a JWT signed
        with ES256, valid for `expires_in` seconds, revocable by `POST /auth/logout`.

  headers:
    IdempotencyReplay:
      description: Present with the value `true` when the response was replayed for a previously used `Idempotency-Key`.
      schema:
        type: string
        enum: ['true']

  responses:
    BadRequest:
      description: The request violates the contract (invalid parameters, invalid body, or a missing required header).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://marketplace.example/problems/validation-error
            title: Bad Request
            status: 400
            detail: "request/headers must have required property 'idempotency-key'"
            instance: /orders

    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://marketplace.example/problems/not-found
            title: Not Found
            status: 404
            detail: Order 'o_999' does not exist.
            instance: /orders/o_999

    IdempotencyKeyReuse:
      description: The `Idempotency-Key` has already been used with a different request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://marketplace.example/problems/idempotency-key-reuse
            title: Unprocessable Entity
            status: 422
            detail: Idempotency-Key '6f1f8f4e...' was already used with a different request body.
            instance: /orders

    Unauthorized:
      description: |
        No access token, or one that is malformed, wrongly signed, expired or revoked
        (for the refresh endpoint: a refresh token that is unknown, used or revoked).
        The client should refresh, or log in again.
      headers:
        WWW-Authenticate:
          description: '`Bearer realm="marketplace"` on protected operations (RFC 6750).'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://marketplace.example/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: The access token is missing, expired, revoked or invalid.
            instance: /orders/o_1

    Forbidden:
      description: |
        The caller is authenticated, and may not do this: the role does not allow it,
        or the order belongs to another user. Refreshing the token will not help.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://marketplace.example/problems/forbidden
            title: Forbidden
            status: 403
            detail: Order 'o_1' does not belong to user '42'.
            instance: /orders/o_1

    InternalServerError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://marketplace.example/problems/internal-server-error
            title: Internal Server Error
            status: 500
            detail: Unexpected error.
            instance: /orders

  schemas:
    Problem:
      type: object
      description: Error format per RFC 9457 (problem details for HTTP APIs).
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the error type — a stable identifier clients use to tell classes of errors apart.
          example: https://marketplace.example/problems/validation-error
        title:
          type: string
          description: Short, human-readable name of the error type, independent of this particular occurrence.
          example: Bad Request
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code, mirrored in the body.
          example: 400
        detail:
          type: string
          description: What exactly went wrong with this specific request.
          example: "request/body/items must NOT have fewer than 1 items"
        instance:
          type: string
          description: Reference to this specific occurrence (the request path that caused it).
          example: /orders

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          example: buyer@example.com
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512
          description: The opaque refresh token from the last login or refresh.

    TokenPair:
      type: object
      required: [token_type, access_token, expires_in, refresh_token, refresh_expires_in]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
          description: JWT (ES256) with `sub`, `role`, `sid` (token family), `jti`, `iss`, `aud`, `exp`.
        expires_in:
          type: integer
          minimum: 1
          description: Lifetime of the access token, in seconds.
          example: 600
        refresh_token:
          type: string
          description: Opaque, single-use. Not a JWT — there is nothing in it to decode.
        refresh_expires_in:
          type: integer
          minimum: 1
          description: Lifetime of the refresh token, in seconds.
          example: 2592000

    Me:
      type: object
      required: [user_id, role, expires_at]
      properties:
        user_id:
          type: string
          example: '42'
        role:
          type: string
          enum: [buyer, seller, admin]
          description: The role as of the token's issue — a cached copy, not a live read.
        expires_at:
          type: string
          format: date-time

    Health:
      type: object
      required: [status, uptime_seconds, pid]
      properties:
        status:
          type: string
          enum: [ok]
        uptime_seconds:
          type: number
          minimum: 0
          description: Seconds since this process started. Survives a password rotation.
          example: 42.137
        pid:
          type: integer
          description: Process id, so a restart is visible even if uptime is read twice.
          example: 4711

    Product:
      type: object
      required: [id, title, price_cents, currency, created_at]
      properties:
        id:
          type: string
          example: p_1
        title:
          type: string
          example: Mechanical keyboard
        price_cents:
          type: integer
          minimum: 0
          description: Price in minor currency units (cents). An integer, never a float.
          example: 260000
        currency:
          type: string
          enum: [UAH, USD, EUR]
          example: UAH
        created_at:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [title, price_cents, currency]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        price_cents:
          type: integer
          minimum: 0
          description: Price in minor currency units (cents).
        currency:
          type: string
          enum: [UAH, USD, EUR]

    ProductPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: Items on the current page.
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque token for the next page. `null` means there are no more pages.
          example: b2Zmc2V0OjIw

    OrderItem:
      type: object
      required: [product_id, qty, unit_price_cents]
      properties:
        product_id:
          type: string
          example: p_1
        qty:
          type: integer
          minimum: 1
          example: 2
        unit_price_cents:
          type: integer
          minimum: 0
          description: Unit price captured when the order was created, in cents.
          example: 260000

    Order:
      type: object
      required: [id, status, buyer_id, currency, items, total_cents, created_at]
      properties:
        id:
          type: string
          example: o_1
        status:
          type: string
          enum: [created, paid, cancelled]
          example: created
        buyer_id:
          type: string
          nullable: true
          description: |
            Who the order belongs to: the subject of the access token that created
            it. Only this user (or an admin) may read the order, change its status,
            or listen to its WebSocket room and SSE stream.
          example: '42'
        currency:
          type: string
          enum: [UAH, USD, EUR]
          example: UAH
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents:
          type: integer
          minimum: 0
          description: Order total in cents. An integer — no "2600.00" strings.
          example: 520000
        created_at:
          type: string
          format: date-time

    UpdateOrderStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [created, paid, cancelled]
          description: The status to write. Publishes one realtime event per accepted write.
          example: paid

    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          description: Order lines; at least one.
          items:
            type: object
            additionalProperties: false
            required: [product_id, qty]
            properties:
              product_id:
                type: string
                minLength: 1
              qty:
                type: integer
                minimum: 1
                maximum: 999

    OrderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: Items on the current page.
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque token for the next page. `null` means there are no more pages.
          example: b2Zmc2V0OjIw
