name: image

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  image:
    name: production image, leak check and the scan gate
    runs-on: ubuntu-latest

    env:
      # The working threshold: CRITICAL+HIGH findings that have a fixed version.
      # The scanner's database changes daily, so this is a ceiling the team moves on
      # purpose (vars.SCAN_MAX), not a number that must stay green by itself.
      SCAN_MAX: ${{ vars.SCAN_MAX || '25' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build-stage token
        # The real registry token when there is one; a random decoy otherwise. Either
        # way it reaches the build only as a BuildKit secret mount.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then printf '%s' "$NPM_TOKEN" > .npm_token
          else openssl rand -hex 16 > .npm_token; fi

      - name: Build
        run: npm run image:build

      - name: Image checks (stages, shell, uid, token in history/config/layers)
        run: |
          npm run demo:image | tee image.txt
          awk -F= '/^stages=/{s=$2}/^shell-inside=/{sh=$2}/^runtime-uid=/{u=$2}/^token-in-/{t+=$2}
            END{ok=(s>=2 && sh==0 && u!=0 && u!="" && t==0); print ok ? "image OK" : "image NOT production-grade"; exit !ok}' image.txt

      - name: Scan gate
        run: npm run scan

      - name: Remove the token
        if: always()
        run: rm -f .npm_token
