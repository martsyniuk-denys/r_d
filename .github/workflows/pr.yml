# The PR pipeline: everything that has to be green before "merge" means anything.
#
#   gates (types · contract · arch · pact) ─┐
#   build (once → GHCR, image checks, scan) ┴─► deploy (OIDC gate → kind → preview
#                                                → cost gate → up → demo:rollout)
#                                                        └─► evidence (always)
#
# Every job here is a place that can say no; branch protection lists them as
# required checks. The artifact pipeline-evidence is uploaded on red runs too.
name: pr

on:
  pull_request:
  workflow_dispatch: {}

# Nothing here grants id-token: write — only the deploy job asks for it.
permissions:
  contents: read

# Two runs of one PR would deploy into kind on two runners and race nothing — but the
# older run's verdict is stale the moment a new commit lands, so it is cancelled.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
    secrets:
      PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}

  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write

  deploy:
    needs: [gates, build]
    uses: ./.github/workflows/deploy-kind.yml
    permissions:
      contents: read
      id-token: write
      packages: read
    with:
      repository: ${{ needs.build.outputs.repository }}
      digest: ${{ needs.build.outputs.digest }}
      cost-bypass-label: ${{ contains(github.event.pull_request.labels.*.name, 'cost-approved') && 'cost-approved' || '' }}
    # a reusable workflow reads its environment's secrets (STORE_KEY of `kind`) only
    # when the caller passes them down
    secrets: inherit

  evidence:
    name: pipeline-evidence
    needs: [gates, build, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/evidence
        with:
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          image-ref: ${{ needs.build.outputs.image-ref }}
          built-digest: ${{ needs.build.outputs.digest }}
          scan-exit: ${{ needs.build.outputs.scan-exit }}
