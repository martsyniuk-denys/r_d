name: evidence
description: >
  Collects build-log and deploy-evidence of this run into the pipeline-evidence
  artifact — evidence.txt, deployment.json, plan.json, rollout.txt, build.log.
  Called from a job with `if: always()`, so a red run has its evidence too.
inputs:
  head-sha:
    required: true
  image-ref:
    required: false
    default: ''
  built-digest:
    required: false
    default: ''
  scan-exit:
    required: false
    default: ''
runs:
  using: composite
  steps:
    # A missing part (its job failed or was skipped) is not an error here: the key it
    # would have given is simply absent from evidence.txt.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        name: build-log
        path: pipeline-evidence
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        name: deploy-evidence
        path: pipeline-evidence
    - name: evidence.txt
      shell: bash
      env:
        RUN_ID: ${{ github.run_id }}
        HEAD_SHA: ${{ inputs.head-sha }}
        IMAGE_REF: ${{ inputs.image-ref }}
        BUILT_DIGEST: ${{ inputs.built-digest }}
        SCAN_EXIT: ${{ inputs.scan-exit }}
      run: |
        mkdir -p pipeline-evidence
        bash scripts/ci/evidence.sh final pipeline-evidence
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pipeline-evidence
        path: |
          pipeline-evidence/evidence.txt
          pipeline-evidence/deployment.json
          pipeline-evidence/plan.json
          pipeline-evidence/rollout.txt
          pipeline-evidence/build.log
        if-no-files-found: warn
