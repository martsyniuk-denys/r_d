services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_DB: marketplace
      POSTGRES_PASSWORD: marketplace_dev_password
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 2s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: marketplace-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '56432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U marketplace -d marketplace']
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    container_name: marketplace-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: marketplace
      RABBITMQ_DEFAULT_PASS: marketplace_dev_password
    ports:
      # 5672 is AMQP — the protocol the client speaks. 15672 is the management UI,
      # which is the only way to look at x-death with your own eyes.
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      # Not "the port is open": between the TCP listener and the Erlang node
      # accepting basic.publish there is a window that hands the client an
      # ECONNRESET. check_running is on the far side of it.
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # Two Redis instances, because a cache and a queue want opposite settings of
  # the same process-wide knob. maxmemory and maxmemory-policy belong to the whole
  # instance — SELECT 1 does not split them — so one container cannot be both.
  #
  # The cache: bounded memory, and when it is full the least recently used key
  # goes. Losing a key costs one trip to Postgres. No RDB, no AOF: a cache that
  # comes back empty after a restart is still a correct cache.
  redis-cache:
    image: redis:8.4-alpine
    container_name: marketplace-redis-cache
    command:
      - redis-server
      - --requirepass
      - redis_dev_password
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
      - --appendonly
      - 'no'
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a redis_dev_password --no-auth-warning ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 20

  # The queue, and everything else that must not vanish on its own: BullMQ jobs,
  # sessions and rate-limit windows. noeviction makes a full instance refuse writes
  # loudly instead of silently dropping a job or logging somebody out; AOF with an
  # fsync every second bounds what a crash can lose to about one second of writes.
  redis-queue:
    image: redis:8.4-alpine
    container_name: marketplace-redis-queue
    command:
      - redis-server
      - --requirepass
      - redis_dev_password
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - '56380:6379'
    volumes:
      - redisqueuedata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a redis_dev_password --no-auth-warning ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 20

  # Object storage: an S3-compatible server, private by default — an anonymous GET
  # is 403. RustFS rather than MinIO because MinIO no longer publishes images; the
  # S3 API is the same, so the code only knows an endpoint. The bucket is created
  # by the code (ensureBucket in src/storage/s3.ts), not here, so `up --wait` has no
  # one-shot container to trip over. Data lives in a named volume, not tmpfs: the
  # demos clean up after themselves, and a tmpfs that is too small kills the
  # server in the middle of a run.
  storage:
    image: rustfs/rustfs:1.0.4
    container_name: marketplace-storage
    environment:
      RUSTFS_ACCESS_KEY: marketplace
      RUSTFS_SECRET_KEY: marketplace_dev_storage_password
    ports:
      - '59000:9000'
    volumes:
      - storagedata:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9000/health || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

  # --- The application -----------------------------------------------------------
  # One image (docker/Dockerfile, the production one: distroless, no shell, uid 65532),
  # five roles. `docker compose up -d --wait` builds it, writes the keys, migrates and
  # seeds, and returns when the API answers its readiness probe.
  #
  # Credentials: the passwords of postgres/rabbitmq/rustfs are the dev values this file
  # already hands those servers, passed to the app as files (compose secrets from the
  # committed secrets/*.example), never as environment values. The app's own secrets —
  # the JWT signing key, the refresh pepper, the payment webhook key — are not in git
  # at all: the `keys` one-shot generates them into the keys volume on the first `up`.
  keys:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: marketplace-api:compose
    command: ['dist/compose-keys.js']
    volumes:
      - keys:/keys

  migrate:
    image: marketplace-api:compose
    command: ['dist/migrate.js']
    depends_on:
      pgbouncer:
        condition: service_healthy
      keys:
        condition: service_completed_successfully
    environment:
      DB_URL: postgres://marketplace@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password

  api:
    image: marketplace-api:compose
    command: ['dist/main.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment: &app-env
      PORT: '3000'
      DB_URL: postgres://marketplace@pgbouncer:6432/marketplace
      DB_PASSWORD_FILE: /run/secrets/db_password
      BROKER_URL: amqp://marketplace@rabbitmq:5672
      BROKER_PASSWORD_FILE: /run/secrets/broker_password
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_BUCKET: marketplace-files
      STORAGE_ACCESS_KEY: marketplace
      STORAGE_SECRET_KEY_FILE: /run/secrets/storage_secret_key
      JWT_PRIVATE_KEY_FILE: /keys/JWT_PRIVATE_KEY
      JWT_PUBLIC_KEY_FILE: /keys/JWT_PUBLIC_KEY
      JWT_KID_FILE: /keys/JWT_KID
      REFRESH_TOKEN_PEPPER_FILE: /keys/REFRESH_TOKEN_PEPPER
      PAYMENT_WEBHOOK_SECRET_FILE: /keys/PAYMENT_WEBHOOK_SECRET
    volumes:
      - keys:/keys:ro
    secrets: &app-secrets
      - db_password
      - broker_password
      - storage_secret_key
    healthcheck:
      # No shell and no curl in the image: the probe is the image's own node.
      test: ['CMD', '/nodejs/bin/node', '-e', "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Outbox → broker. Several relays may run: rows are claimed with SKIP LOCKED.
  relay:
    image: marketplace-api:compose
    command: ['dist/relay.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment: *app-env
    secrets: *app-secrets

  # order.placed → fulfilment + pending→confirmed, in one transaction per message.
  consumer:
    image: marketplace-api:compose
    command: ['dist/consumer.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment: *app-env
    secrets: *app-secrets

  # The contour demos, run against the API above by name — no node on the host needed:
  #   docker compose run --rm demo demo/contour.mjs
  #   docker compose run --rm demo demo/webhook.mjs
  # The provider simulator signs with the webhook key from the keys volume (read-only).
  demo:
    image: node:22-alpine
    profiles: [demo]
    entrypoint: ['node']
    working_dir: /work
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:3000
      PAYMENT_WEBHOOK_SECRET_FILE: /keys/PAYMENT_WEBHOOK_SECRET
    volumes:
      - ./demo:/work/demo:ro
      - keys:/keys:ro

  pact-broker-db:
    image: postgres:16-alpine
    container_name: marketplace-pact-broker-db
    environment:
      POSTGRES_USER: pactbroker
      POSTGRES_DB: pactbroker
      POSTGRES_PASSWORD: pactbroker_dev_password
    volumes:
      - pactbrokerdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pactbroker -d pactbroker']
      interval: 2s
      timeout: 3s
      retries: 20

  pact-broker:
    image: pactfoundation/pact-broker:2.143.0-pactbroker2.121.0
    container_name: marketplace-pact-broker
    depends_on:
      pact-broker-db:
        condition: service_healthy
    ports:
      - '9292:9292'
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: pact-broker-db
      PACT_BROKER_DATABASE_NAME: pactbroker
      PACT_BROKER_DATABASE_USERNAME: pactbroker
      PACT_BROKER_DATABASE_PASSWORD: pactbroker_dev_password
      PACT_BROKER_PORT: '9292'
      PACT_BROKER_LOG_LEVEL: WARN
      # The local broker is deliberately open: it holds nothing but the contract
      # this repository generates, and a token here would only be a constant in
      # git. A real broker is reached with PACT_BROKER_TOKEN, which comes from the
      # store locally and from GitHub secrets in CI.
      PACT_BROKER_PUBLIC_HEARTBEAT: 'true'
    healthcheck:
      # 127.0.0.1 and not localhost: inside the container localhost resolves to
      # ::1 first, and puma is only listening on IPv4.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

secrets:
  db_password:
    file: ./secrets/db_password.example
  broker_password:
    file: ./secrets/broker_password.example
  storage_secret_key:
    file: ./secrets/storage_secret_key.example

volumes:
  keys:
  pgdata:
  pactbrokerdata:
  rabbitmqdata:
  redisqueuedata:
  storagedata:
