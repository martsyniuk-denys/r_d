services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_DB: marketplace
      POSTGRES_PASSWORD: marketplace_dev_password
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace']
      interval: 2s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: marketplace-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '56432:6432'
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U marketplace -d marketplace']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
